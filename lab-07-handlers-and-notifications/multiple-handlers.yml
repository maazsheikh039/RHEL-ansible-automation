---
- name: Multiple Handlers and Chain Execution
  hosts: all
  gather_facts: yes
  vars:
    server_admin: "admin@example.com"

  tasks:
    - name: Update ServerAdmin directive in web server config
      lineinfile:
        path: "{{ '/etc/httpd/conf/httpd.conf' if ansible_os_family == 'RedHat' else '/etc/apache2/apache2.conf' }}"
        regexp: '^ServerAdmin '
        line: "ServerAdmin {{ server_admin }}"
      notify:
        - validate configuration
        - reload web server
        - log configuration change

  handlers:
    - name: validate configuration
      command: "{{ 'httpd -t' if ansible_os_family == 'RedHat' else 'apache2ctl configtest' }}"
      register: config_test
      changed_when: false

    - name: reload web server
      service:
        name: "{{ 'httpd' if ansible_os_family == 'RedHat' else 'apache2' }}"
        state: reloaded

    - name: log configuration change
      lineinfile:
        path: /var/log/ansible_config_changes.log
        line: "{{ ansible_date_time.iso8601 }} - Config updated and web server reloaded by Ansible"
        create: yes
        mode: '0644'
