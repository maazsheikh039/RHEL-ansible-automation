---
- name: Deploy Website Content
  hosts: webservers
  become: yes
  vars:
    document_root: /var/www/html

  tasks:
    - name: Deploy main HTML page from Jinja2 template
      template:
        src: ../templates/index.html.j2
        dest: "{{ document_root }}/index.html"
        owner: apache
        group: apache
        mode: '0644'
      notify: reload apache
      tags: deploy

    - name: Deploy CSS file
      copy:
        src: ../files/style.css
        dest: "{{ document_root }}/style.css"
        owner: apache
        group: apache
        mode: '0644'
      tags: deploy

    - name: Create images directory
      file:
        path: "{{ document_root }}/images"
        state: directory
        owner: apache
        group: apache
        mode: '0755'
      tags: deploy

    - name: Deploy additional HTML pages
      copy:
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>About - {{ inventory_hostname }}</title>
              <link rel="stylesheet" href="style.css">
          </head>
          <body>
              <div class="container">
                  <h1>About {{ inventory_hostname }}</h1>
                  <p>This is the about page for {{ inventory_hostname }} managed via Ansible.</p>
                  <p><a href="index.html" class="button">Back to Home</a></p>
              </div>
          </body>
          </html>
        dest: "{{ document_root }}/about.html"
        owner: apache
        group: apache
        mode: '0644'
      tags: deploy

    - name: Verify web content deployment via URI
      uri:
        url: "http://{{ ansible_default_ipv4.address }}"
        method: GET
        status_code: 200
      register: web_check
      tags: verify

    - name: Display web check results
      debug:
        msg: "Website is accessible on {{ inventory_hostname }}. HTTP Status: {{ web_check.status }}"
      tags: verify

  handlers:
    - name: reload apache
      systemd:
        name: httpd
        state: reloaded
