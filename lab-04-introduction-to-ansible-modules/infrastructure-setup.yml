### Key Practical Insights & Enhancements for Your Workflows

While the lab steps are completely functional as provided, keep the following production best practices in mind when executing or adapting these playbooks:

#### 1. Modernizing Red Hat Package Management (`dnf` vs `yum`)
In modern RHEL, CentOS 8+, Fedora, and Rocky/AlmaLinux, `dnf` has replaced `yum`. While `yum` acts as a symlink/wrapper for `dnf` on newer systems, it is generally recommended to use the **`package`** module or explicit **`dnf`** module for modern RHEL deployments.

#### 2. Cross-Platform Abstraction using `ansible.builtin.package`
In **Task 3.1** and **Task 4.1**, you used the generic `package` module. This module automatically detects the underlying package manager (`apt`, `dnf`, `yum`, `zypper`, etc.) based on host facts, reducing the need for explicit conditional blocks (`when: ansible_os_family == "RedHat"`) for simple package installs.

#### 3. Best Practices Summary
* **Idempotency:** Always specify `state: present` (or `started`) rather than running commands directly via `shell` or `command` modules.
