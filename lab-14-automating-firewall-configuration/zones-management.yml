---
- name: Manage Firewall Zones
  hosts: all
  become: yes
  tasks:
    - name: Query all available firewall zones
      command: firewall-cmd --get-zones
      register: available_zones
      changed_when: false

    - name: Display available zones
      debug:
        msg: "Available zones: {{ available_zones.stdout }}"

    - name: Get active default zone
      command: firewall-cmd --get-default-zone
      register: default_zone
      changed_when: false

    - name: Display default zone
      debug:
        msg: "Default zone: {{ default_zone.stdout }}"

    - name: Create custom DMZ zone
      ansible.posix.firewalld:
        zone: dmz-custom
        permanent: yes
        state: present

    - name: Populate DMZ zone with web and remote access services
      ansible.posix.firewalld:
        zone: dmz-custom
        service: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - http
        - https
        - ssh

    - name: Add primary interface to public zone
      ansible.posix.firewalld:
        zone: public
        interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
        permanent: yes
        state: enabled
        immediate: yes
      ignore_errors: yes

    - name: Set trusted zone source network
      ansible.posix.firewalld:
        zone: trusted
        source: 192.168.1.0/24
        permanent: yes
        state: enabled
        immediate: yes

    - name: Inspect zone configurations
      command: firewall-cmd --list-all-zones
      register: all_zones
      changed_when: false

    - name: Display zones summary
      debug:
        msg: "{{ all_zones.stdout_lines[:40] }}"
