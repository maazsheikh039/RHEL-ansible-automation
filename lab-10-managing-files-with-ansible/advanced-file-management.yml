---
- name: Advanced File Management with Ansible
  hosts: webservers
  become: yes
  vars:
    config_timestamp: "{{ ansible_date_time.epoch | default('1600000000') }}"
    
  tasks:
    - name: Create directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /opt/app/config
        - /opt/app/templates
        - /opt/app/static
        - /var/log/app
        - /backup

    - name: Copy static configuration files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0644') }}"
        backup: yes
      loop:
        - src: static-files/apache-security.conf
          dest: /opt/app/config/security.conf
        - src: static-files/favicon.ico
          dest: /opt/app/static/favicon.ico

    - name: Deploy templates with conditional content
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0644') }}"
        backup: yes
      loop:
        - src: vhost.conf.j2
          dest: /opt/app/config/{{ server_name }}.conf
        - src: system-info.conf.j2
          dest: /opt/app/config/system-info.conf
        - src: index.html.j2
          dest: "{{ document_root }}/index.html"

    - name: Create file with dynamic content using copy module
      copy:
        content: |
          # Configuration Summary
          # Generated: {{ ansible_date_time.iso8601 | default('2026-09-23T08:00:00Z') }}
          
          SERVER_NAME={{ server_name }}
          ENVIRONMENT={{ environment }}
          TIMESTAMP={{ config_timestamp }}
          
          # Ansible Facts
          HOSTNAME={{ ansible_hostname }}
          FQDN={{ ansible_fqdn | default(ansible_hostname) }}
          IP_ADDRESS={{ ansible_default_ipv4.address | default('127.0.0.1') }}
          
          # System Resources
          MEMORY_MB={{ ansible_memtotal_mb | default(2048) }}
          SWAP_MB={{ ansible_swaptotal_mb | default(1024) }}
          PROCESSOR_COUNT={{ ansible_processor_count | default(2) }}
          
        dest: /opt/app/config/deployment-summary.conf
        mode: '0644'

    - name: Set file attributes and directory permissions
      file:
        path: "{{ item.path }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /opt/app/config
          mode: '0755'
        - path: /opt/app/static
          mode: '0755'
