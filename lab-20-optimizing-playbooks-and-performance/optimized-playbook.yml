---
- name: Deploy Web Application Infrastructure
  hosts: webservers
  become: yes
  gather_facts: yes
  
  roles:
    - role: security
      tags: security
    - role: database
      tags: database
    - role: webserver
      tags: webserver
    - role: application
      tags: application
    - role: monitoring
      tags: monitoring

  post_tasks:
    - name: Display completion summary
      debug:
        msg: "Role-based deployment executed successfully on {{ inventory_hostname }}"
      tags: verification
