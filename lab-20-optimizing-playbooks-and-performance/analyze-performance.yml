---
- name: Analyze Playbook Performance Results
  hosts: localhost
  gather_facts: yes
  
  tasks:
    - name: Generate performance summary report
      copy:
        content: |
          {
            "benchmark_summary": {
              "analysis_date": "{{ ansible_date_time.iso8601 }}",
              "recommendations": [
                "Use modular role-based playbooks for maintainability",
                "Implement asynchronous execution for long-running package operations",
                "Enable fact caching to eliminate repeated gathering latency",
                "Utilize task delegation to offload control node operations"
              ]
            }
          }
        dest: /tmp/ansible-benchmarks/dashboard-data.json

    - name: Display Optimization Strategy Principles
      debug:
        msg: |
          ================ Performance Optimization Applied ================
          1. MODULARITY        : Converted monolithic playbook to clean role architecture.
          2. ASYNC EXECUTION   : Asynchronous background processing with async_status polls.
          3. TASK DELEGATION   : Offloaded certificate & DNS operations to localhost via delegate_to.
          4. PARALLEL STRATEGY : Activated free strategy and tuned forks in ansible.cfg.
          5. FACT CACHING      : Enabled jsonfile fact caching with 3600s TTL.
