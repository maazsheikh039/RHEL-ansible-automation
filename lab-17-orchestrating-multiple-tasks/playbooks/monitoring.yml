---
- name: "Setup Basic Monitoring"
  hosts: all
  become: yes
  
  tasks:
    - name: "Install monitoring tools"
      yum:
        name:
          - htop
          - iotop
        state: present

    - name: "Create monitoring script"
      copy:
        content: |
          #!/bin/bash
          echo "=== System Status Report ==="
          echo "Hostname: $(hostname)"
          echo "Date: $(date)"
          echo "Uptime: $(uptime)"
          echo "Disk Usage:"
          df -h /
          echo "Memory Usage:"
          free -h
          echo "Active Services:"
          systemctl list-units --type=service --state=active | grep -E "(httpd|mariadb|haproxy)"
        dest: /usr/local/bin/system-status.sh
        mode: '0755'

    - name: "Create monitoring cron job"
      cron:
        name: "System status monitoring"
        minute: "*/15"
        job: "/usr/local/bin/system-status.sh >> /var/log/system-status.log 2>&1"

- name: "Validate Complete Stack"
  hosts: localhost
  gather_facts: no
  
  tasks:
    - name: "Test database connectivity"
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        login_host: "{{ hostvars[groups['database_servers'][0]]['ansible_default_ipv4']['address'] }}"
        login_user: "{{ db_user }}"
        login_password: "{{ vault_db_password }}"
      delegate_to: "{{ groups['database_servers'][0] }}"

    - name: "Test web servers individually"
      uri:
        url: "http://{{ hostvars[item]['ansible_default_ipv4']['address'] }}/{{ app_name }}/"
        method: GET
        status_code: 200
      loop: "{{ groups['web_servers'] }}"
      register: web_test_results

    - name: "Test load balancer"
      uri:
        url: "http://{{ hostvars[groups['load_balancer'][0]]['ansible_default_ipv4']['address'] }}"
        method: GET
        status_code: 200
      register: lb_test_result

    - name: "Display validation results"
      debug:
        msg: |
          ================ Orchestration Validation Summary ================
          Database Connection : SUCCESS
          Web Servers Checked : {{ web_test_results.results | length }} operational
          Load Balancer State : {{ 'WORKING (HTTP 200)' if lb_test_result.status == 200 else 'FAILED' }}
          
          Application Gateway Endpoint: http://{{ hostvars[groups['load_balancer'][0]]['ansible_default_ipv4']['address'] }}
