---
- name: Enhanced package installation and configuration
  hosts: managed_nodes
  become: yes
  gather_facts: yes
  
  vars:
    packages:
      - httpd
      - wget
    web_port: 80
    document_root: /var/www/html
    
  pre_tasks:
    - name: Verify package manager readiness
      package_fact_mgr:
      tags: always
      
  tasks:
    - name: Install required packages
      package:
        name: "{{ packages }}"
        state: present
      notify:
        - start httpd
      tags: packages
      
    - name: Create custom web content
      template:
        src: index.html.j2
        dest: "{{ document_root }}/index.html"
        owner: apache
        group: apache
        mode: '0644'
      notify: restart httpd
      tags: content
      
    - name: Ensure web service is running and enabled
      service:
        name: httpd
        state: started
        enabled: yes
      tags: services
      
  handlers:
    - name: start httpd
      service:
        name: httpd
        state: started
        enabled: yes
        
    - name: restart httpd
      service:
        name: httpd
        state: restarted
        
  post_tasks:
    - name: Display completion message
      debug:
        msg: "Playbook execution completed successfully on {{ inventory_hostname }}"
